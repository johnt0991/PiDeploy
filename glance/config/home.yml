- name: Home
  width: wide
  desktop-navigation-width: wide

  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday
          
        - type: custom-api
          title: Random Fact
          cache: 3h
          url: https://uselessfacts.jsph.pl/api/v2/facts/random
          template: |
            <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

        - type: weather
          location: Martinez, California, United States
          units: imperial # alternatively "metric"
          hour-format: 12h # alternatively "24h"

    - size: full
      widgets:
        - type: group
          widgets:
            - type: videos
              title: Youtube
              style: grid-cards
              include-shorts: true
              limit: 30
              collapse-after-rows: 3
              channels:
                - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                - UCqFzWxSCi39LnW1JKFR3efg # SNL
                - UC8-Th83bH_thdKZDJCrn88g # Jimmy Fallon
                - UCJnS2EsPfv46u1JR8cnD0NA # NPR
                - UCPD_bxCRGpmmeQcbe2kpPaA # First We Feast
                - UCc9CjaAjsMMvaSghZB7-Kog # Beard Meats Food
                - UCpbWmV3trWP4kqbNawlXIcQ # Jeff Arcuri
                - UCXGR70CkW_pXb8n52LzCCRw # Mythical Kitchen
                - UCLe_q9axMaeTbjN0hy1Z9xA # Caleb Hammer
                - UCMSYZVlQmyG8_2MkIKzg0kw # The Iced Coffee Hour
            - type: rss
              title: Recipes
              limit: 20
              cache: 12h
              style: detailed-list
              feeds:
                - url: https://feeds.feedburner.com/smittenkitchen
                  title: Smitten Kitchen
                - url: https://www.budgetbytes.com/feed/
                  title: Budget Bytes              
                - url: https://thesouthernladycooks.com/feed/
                  title: The Southern Lady Cooks   
                - url: https://spicysouthernkitchen.com/feed/
                  title: Spicy Southern Kitchen
                - url: https://southernbite.com/feed/
                  title: Southern Bite
  

        - type: group
          widgets:
            - type: reddit
              subreddit: lol
              show-thumbnails: true
            - type: reddit
              subreddit: news
              show-thumbnails: true        
            - type: reddit
              subreddit: Unexpected
              show-thumbnails: true      
            - type: reddit
              subreddit: ComedyHeaven
              show-thumbnails: true
            - type: reddit
              subreddit: worldnews
              show-thumbnails: true            
            - type: reddit
              subreddit: mildlyinteresting
              show-thumbnails: true        
            - type: reddit
              subreddit: ContagiousLaughter
              show-thumbnails: true                            


    - size: small
      widgets:
        - type: rss
          title: News
          limit: 10
          collapse-after: 6
          feeds:
            - url: https://www.kron4.com/news/app-feed
              title: KRON4 San Francisco
              limit: 3
            - url: https://feeds.npr.org/1001/rss.xml
              title: NPR Top Stories
              limit: 3
            - url: https://abc7news.com/feed/
              title: ABC7 Bay Area
              limit: 3
