- name: Home
  width: wide
  desktop-navigation-width: wide
  head-widgets:
    - type: markets
      markets:
        - symbol: DIS
          name: Disney
        - symbol: IIPR
          name: IIPR
        - symbol: INTC
          name: Intel
        - symbol: SBLX
          name: StableX
        - symbol: MAT
          name: Mattel
        - symbol: META
          name: META
        - symbol: CSCO
          name: Cisco
        - symbol: AAPL
          name: Apple

    - type: custom-api
      title: Crypto Markets
      url: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,chain-2,loopring,polygon-ecosystem-token&order=market_cap_desc&per_page=5&page=1&sparkline=false&price_change_percentage=24h"
      template: |
        <div>
          {{ if eq .Response.StatusCode 200 }}
            {{ $coins := .JSON.Array "" }}
            {{ if gt (len $coins) 0 }}
              <!-- Outer container: row that fills width and wraps when needed -->
              <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 4px 0;">
                {{ range $coins }}
                  {{ $name := .String "name" }}
                  {{ $symbol := .String "symbol" }}
                  {{ $id := .String "id" }}
                  {{ $price := printf "%.2f" (.Float "current_price") }}
                  {{ $change := .Float "price_change_percentage_24h" }}
                  {{ $changeStr := printf "%.2f" $change }}

                  <!-- Each item flexes to share the row equally -->
                  <div style="display: flex; align-items: center; flex: 1 1 150px; min-width: 0;">
                    <a
                      href="https://www.coingecko.com/en/coins/{{ $id }}"
                      target="_blank"
                      style="display: flex; align-items: center; text-decoration: none; width: 100%;"
                    >
                      <img
                        src="{{ .String "image" }}"
                        alt="{{ $name }}"
                        style="width: 32px; height: 32px; border-radius: var(--border-radius); margin-right: 10px; flex-shrink: 0;"
                      >
                      <div style="min-width: 0;">
                        <span class="size-base color-primary">
                          {{ $name }}
                        </span>
                        <span class="size-caption color-subdue"> ({{ $symbol }})</span>
                        <br>
                        <span class="size-h5 color-subdue">
                          Price: ${{ $price }} ·
                          {{ if gt $change 0.0 }}
                            <span class="color-success">▲ {{ $changeStr }}%</span>
                          {{ else }}
                            <span class="color-danger">▼ {{ $changeStr }}%</span>
                          {{ end }}
                        </span>
                      </div>
                    </a>
                  </div>
                {{ end }}
              </div>
            {{ else }}
              <p class="color-negative">No crypto data found.</p>
            {{ end }}
          {{ else }}
            <p class="color-negative">An unexpected error occurred. Please try again later.</p>
          {{ end }}
        </div>



  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday
          
        - type: custom-api
          title: Random Fact
          cache: 3h
          url: https://uselessfacts.jsph.pl/api/v2/facts/random
          template: |
            <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

        - type: weather
          location: Martinez, California, United States
          units: imperial # alternatively "metric"
          hour-format: 12h # alternatively "24h"

    - size: full
      widgets:
        - type: group
          widgets:
            - type: videos
              title: Youtube
              style: grid-cards
              channels:
                - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                - UCqFzWxSCi39LnW1JKFR3efg # SNL
                - UC8-Th83bH_thdKZDJCrn88g # Jimmy Fallon
                - UCJnS2EsPfv46u1JR8cnD0NA # NPR
                - UCPD_bxCRGpmmeQcbe2kpPaA #First We Feast
                - UCc9CjaAjsMMvaSghZB7-Kog # Beard Meats Food
            - type: rss
              title: Recipes
              limit: 20
              cache: 12h
              style: detailed-list
              feeds:
                - url: https://feeds.feedburner.com/smittenkitchen
                  title: Smitten Kitchen
                - url: https://www.budgetbytes.com/feed/
                  title: Budget Bytes              
                - url: https://thesouthernladycooks.com/feed/
                  title: The Southern Lady Cooks   

        - type: group
          widgets:
            - type: reddit
              subreddit: lol
              show-thumbnails: true
            - type: reddit
              subreddit: ArtificialInteligence
              show-thumbnails: true            
            - type: reddit
              subreddit: news
              show-thumbnails: true                         
            - type: reddit
              subreddit: wallstreetbets
              show-thumbnails: true

    - size: small
      widgets:
        - type: rss
          title: News
          limit: 10
          collapse-after: 6
          feeds:
            - url: https://www.kron4.com/news/app-feed
              title: KRON4 San Francisco
              limit: 3
            - url: https://feeds.npr.org/1001/rss.xml
              title: NPR Top Stories
              limit: 3
