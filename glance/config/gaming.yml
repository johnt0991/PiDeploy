- name: Gaming
  width: wide
  desktop-navigation-width: wide
  columns:
    - size: small
      widgets:
        - type: custom-api
          title: Steam Specials
          cache: 12h
          url: https://store.steampowered.com/api/featuredcategories?cc=us
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
            {{ range .JSON.Array "specials.items" }}
              {{ $header := .String "header_image" }}
              {{ $urlPrefix := "https://store.steampowered.com/sub/" }}
              {{ if findMatch "/steam/apps/" $header }}
                {{ $urlPrefix = "https://store.steampowered.com/app/" }}
              {{ end }}
              <li>
                <a class="size-h4 color-highlight block text-truncate" href="{{ $urlPrefix }}{{ .Int "id" }}/">{{ .String "name" }}</a>
                <ul class="list-horizontal-text">
                  <li>{{ .Int "final_price" | toFloat | mul 0.01 | printf "$%.2f" }}</li>
                  {{ $discount := .Int "discount_percent" }}
                  <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                </ul>
              </li>
            {{ end }}
            </ul>
            
        - type: custom-api
          title: Steam Top Sellers
          cache: 12h
          url: https://store.steampowered.com/api/featuredcategories?cc=us
          template: |
            <ul class="list list-gap-10 collapsible-contain" data-collapse-after="15">
                {{ range .JSON.Array "top_sellers.items" }}
                {{ if ne (.String "name") "Steam Deck" }}
                <li style="display: flex; align-items: center; gap: 1rem;">
                    <img src="{{ .String "small_capsule_image" }}" alt="{{ .String "name" }}"
                        style="width: 120px; height: auto; border-radius: 4px; flex-shrink: 0;">
                    <div style="min-width: 0;">
                        <a class="size-h4 color-highlight text-truncate" style="display: block;"
                            href="https://store.steampowered.com/app/{{ .Int "id" }}/">
                            {{ .String "name" }}
                        </a>
                        <ul class="list-horizontal-text">
                            <li>{{ div (.Int "final_price" | toFloat) 100 | printf "$%.2f" }}</li>
                            {{ $discount := .Int "discount_percent" }}
                            {{ if gt $discount 0 }}
                            <li{{ if ge $discount 40 }} class="color-positive" {{ end }}>
                                {{ $discount }}% off
                </li>
                {{ end }}
            </ul>
            </div>
            </li>
            {{ end }}
            {{ end }}
            </ul>

    - size: full
      widgets:
      
      - type: custom-api
        title: Recent Steam Achievements
        css-class: widget-type-steam-achievements
        cache: 1h
        url: http://steam-achievements-api:8095/recent-achievements?limit=10
        template: |
          {{ if eq .Response.StatusCode 200 }}
            {{ $achievements := .JSON.Array "achievements" }}
            {{ if gt (len $achievements) 0 }}
              <ul class="steam-achievement-list list list-gap-10">
                {{ range $achievements }}
                <li class="steam-achievement-card flex items-start gap-15">
                  {{ if (.String "icon") }}
                  <a class="shrink-0" href="{{ .String "achievement_url" }}" target="_blank" rel="noreferrer">
                    <img src="{{ .String "icon" }}" alt="" loading="lazy" style="width: 48px; height: 48px; border-radius: var(--border-radius);">
                  </a>
                  {{ else }}
                  <div class="steam-achievement-icon-placeholder shrink-0"></div>
                  {{ end }}
                  <div class="min-width-0 grow">
                    <a class="steam-achievement-title color-highlight size-h4 block text-truncate" href="{{ .String "achievement_url" }}" target="_blank" rel="noreferrer">{{ .String "display_name" }}</a>
                    <div class="steam-achievement-game color-subdue size-h5 text-truncate">{{ .String "game_name" }}</div>
                    {{ if (.String "description") }}
                    <div class="steam-achievement-description size-h5 color-primary">{{ .String "description" }}</div>
                    {{ end }}
                    <div class="steam-achievement-meta size-h6 color-subdue margin-top-3">Unlocked {{ .String "unlock_date" }}</div>
                  </div>
                </li>
                {{ end }}
              </ul>
            {{ else }}
              <p class="color-negative">No recent Steam achievements found.</p>
            {{ end }}
          {{ else }}
            <p class="color-negative">Steam achievements API is unavailable.</p>
          {{ end }}

      - type: custom-api
        title: Steam Achievement Challenge
        css-class: widget-type-steam-achievement-challenge
        cache: 5m
        url: http://steam-achievements-api:8095/weekly-challenge?count=3
        template: |
          {{ if eq .Response.StatusCode 200 }}
            {{ $challenges := .JSON.Array "challenges" }}
            {{ if gt (len $challenges) 0 }}
              <ul class="steam-achievement-list list list-gap-10">
                {{ range $challenges }}
                <li class="steam-achievement-card{{ if .Bool "completed" }} is-complete{{ end }} flex items-start gap-15">
                  {{ if (.String "icongray") }}
                  <a class="shrink-0" href="{{ .String "achievement_url" }}" target="_blank" rel="noreferrer">
                    <img src="{{ .String "icongray" }}" alt="" loading="lazy" style="width: 48px; height: 48px; border-radius: var(--border-radius);">
                  </a>
                  {{ else }}
                  <div class="steam-achievement-icon-placeholder shrink-0"></div>
                  {{ end }}
                  <div class="min-width-0 grow">
                    <a class="steam-achievement-title color-highlight size-h4 block text-truncate" href="{{ .String "achievement_url" }}" target="_blank" rel="noreferrer">{{ .String "display_name" }}</a>
                    <a class="steam-achievement-game color-primary size-h5 block text-truncate" href="{{ .String "store_url" }}" target="_blank" rel="noreferrer">{{ .String "game_name" }}</a>
                    {{ if (.String "description") }}
                    <div class="steam-achievement-description size-h5 color-subdue">{{ .String "description" }}</div>
                    {{ else }}
                    <div class="steam-achievement-description size-h5 color-subdue">Hidden or mystery achievement.</div>
                    {{ end }}
                    {{ if .Bool "completed" }}
                    <div class="steam-achievement-meta size-h6 color-success margin-top-3">Completed {{ .String "unlock_date" }}</div>
                    {{ end }}
                  </div>
                </li>
                {{ end }}
              </ul>
              <div class="size-h6 color-subdue margin-top-10">Refreshes Monday at 6:00 AM</div>
            {{ else }}
              <p class="color-negative">No locked Steam achievements found for this week.</p>
            {{ end }}
          {{ else }}
            <p class="color-negative">Steam achievement challenge is unavailable.</p>
          {{ end }}
          
                
      - type: videos
        title: Youtube
        style: grid-cards
        include-shorts: true
        limit: 30
        collapse-after-rows: 3
        channels:
          - UCto7D1L-MiRoOziCXK9uT5Q # Letsgameitout
          - UCyS4xQE6DK4_p3qXQwJQAyA # Did you know gaming
          - UCHdos0HAIEhIMqUc9L3vh1w #Dorkly
          - UCETZ4AkABYwBRzpWBJ33KUw # Bobby Ivar

      - type: group
        widgets:
        - type: reddit
          subreddit: arcraiders
          show-thumbnails: true
        - type: reddit
          subreddit: gaming
          show-thumbnails: true
        - type: reddit
          subreddit: games
          show-thumbnails: true
        - type: reddit
          subreddit: reddeadredemption
          show-thumbnails: true
        - type: reddit
          subreddit: crosswind
          show-thumbnails: true
        - type: reddit
          subreddit: unrealengine5
          show-thumbnails: true          

    - size: small
      widgets:
      - type: custom-api
        title: Squids Recently Played Games
        cache: 30m
        url: http://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v0001/?key=68AF8D904102838D98D6715733F0B02F&steamid=76561198046289926}&format=json
        template: |
          <div>
            {{ if eq .Response.StatusCode 200 }}
              {{ $games := .JSON.Array "response.games" }}
              {{ if gt (len $games) 0 }}
                <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                  {{ range $games }}
                    <li style="display: flex; align-items: center;">
                      <a href="https://store.steampowered.com/app/{{ .Int "appid" }}" target="_blank">
                        <img
                          src="http://media.steampowered.com/steamcommunity/public/images/apps/{{ .Int "appid" }}/{{ .String "img_icon_url" }}.jpg"
                          alt="{{ .String "name" }}"
                          style="width: 32px; border-radius: var(--border-radius); margin-right: 10px;">
                      </a>
                      <div>
                        <a
                          href="https://store.steampowered.com/app/{{ .Int "appid" }}"
                          class="size-base color-primary"
                          target="_blank"
                        >
                          {{ .String "name" }}
                        </a>
                        <br>
                        <span class="size-h5 color-subdue">
                          Last 2 weeks: 
                          {{ if gt (toFloat (.Int "playtime_2weeks")) 60.0 }}
                            {{ printf "%.2f hrs" (div (toFloat (.Int "playtime_2weeks")) 60.0) }}
                          {{ else }}
                            {{ .Int "playtime_2weeks" }} mins
                          {{ end }}
                        </span>
                      </div>
                    </li>
                  {{ end }}
                </ul>
              {{ else }}
                <p class="color-negative">No recently played games found.</p>
              {{ end }}
            {{ else }}
              <p class="color-negative">An unexpected error occurred. Please try again later.</p>
            {{ end }}
          </div> 
      - type: bookmarks
        groups:
          - title: Interactive Game Maps
            links:
              - title: Windrose
                url: https://windrose.tools/map?layout=cfe2aa209f136f93
                icon: /assets/windrose.png
              - title: Valheim
                url: https://valheim-map.world/index.html
                icon: /assets/valheim.jpg
              - title: Arc Raiders
                url: https://mapgenie.io/arc-raiders
                icon: /assets/arcraiders.png
              - title: DayZ
                url: https://www.izurvive.com/
                icon: /assets/dayz.ico
              - title: Icarus
                url: https://mapgenie.io/icarus/maps/icarus
                icon: /assets/icarus.ico
                


      - type: rss
        title: Gaming News
        limit: 10
        collapse-after: 6
        feeds:
          - url: https://feeds.feedburner.com/ign/news
            title: IGN News
            limit: 3
          - url: https://feeds.feedburner.com/ign/games-all
            title: IGN Game Articles
            limit: 3            
